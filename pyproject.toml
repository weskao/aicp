[project]
# PyPI distribution name only — the `aicp` name was taken in 2021 by an
# unrelated project. The command, import path and repo stay `aicp`.
name = "aicp-cli"
version = "0.9.1"
description = "AI commit + push, with a git-verified result summary"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wes Kao" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
aicp = "aicp.cli:main"

[project.urls]
Repository = "https://github.com/weskao/aicp"
Issues = "https://github.com/weskao/aicp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicp"]

# The vendored skills are runtime data, not just repo files: without this the
# wheel ships no skills/ at all, skills._vendor_dir() falls back to a checkout
# path that does not exist once installed, and `aicp --config` -> Skills can
# install nothing. The in-package name is `_skills_data`, NOT `skills`, which
# would shadow the aicp.skills module.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "aicp/_skills_data"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
# skills/ is vendored, byte-identical to its ~/.claude source (see
# contracts.py's SKILL_VERSION_* docstring) — never linted or reformatted.
extend-exclude = ["skills"]
