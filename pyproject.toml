[project]
name = "aicp"
version = "0.1.0"
description = "AI commit + push, with a git-verified result summary"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wes Kao" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
aicp = "aicp.cli:main"

[project.urls]
Repository = "https://github.com/weskao/aicp"
Issues = "https://github.com/weskao/aicp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicp"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
# skills/ is vendored, byte-identical to its ~/.claude source (see
# contracts.py's SKILL_VERSION_* docstring) — never linted or reformatted.
extend-exclude = ["skills"]
